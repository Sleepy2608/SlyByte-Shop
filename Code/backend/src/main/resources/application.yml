spring:
  application:
    name: ecommerce

  # =================== DATABASE ===================
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:slybyte_shop}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:123456}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # =================== JPA / HIBERNATE ===================
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}           # validate: chỉ kiểm tra, KHÔNG tự tạo/xóa bảng
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # =================== FILE UPLOAD ===================
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# =================== SERVER ===================
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api             # Tất cả API đều có prefix /api

# =================== JWT ===================
jwt:
  secret: ${JWT_SECRET:your-super-secret-jwt-key-at-least-256-bits-long-change-this-in-production}
  expiration: ${JWT_EXPIRATION:86400000}             # 24 giờ (ms)
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}    # 7 ngày (ms)

# =================== CORS ===================
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
