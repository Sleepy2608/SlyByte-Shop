services:
  # ============================================================
  # 1. DATABASE: MySQL 8.0
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: slybyte-mysql
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: slybyte_shop
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Code/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./Code/database/seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql:ro
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - slybyte-net

  # ============================================================
  # 2. BACKEND: Spring Boot 3.3.4 (Java 21)
  # ============================================================
  backend:
    build:
      context: ./Code/backend
      dockerfile: Dockerfile
    container_name: slybyte-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: slybyte_shop
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-at-least-256-bits-long-change-this-in-production}
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://frontend:3000
    ports:
      - "8080:8080"
    networks:
      - slybyte-net

  # ============================================================
  # 3. FRONTEND: Next.js 14 App Router (Node 20 Standalone)
  # ============================================================
  frontend:
    build:
      context: ./Code/frontend
      dockerfile: Dockerfile
    container_name: slybyte-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_INTERNAL_URL: http://backend:8080
    ports:
      - "3000:3000"
    networks:
      - slybyte-net

# ============================================================
# PERSISTENT VOLUMES & ISOLATED NETWORK
# ============================================================
volumes:
  mysql_data:
    driver: local

networks:
  slybyte-net:
    driver: bridge
